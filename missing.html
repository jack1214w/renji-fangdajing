<style>
:root{
  --bg:#141a21; --panel:#1e2630; --panel2:#283341; --edge:#0b0e12; --hi:#3d4c5e;
  --ink:#e8ecf0; --dim:#9aa7b5; --gold:#e3b95b; --green:#7cc08c; --red:#e07f78; --blue:#7fa9d8;
  --paper:#f3ead6; --paperink:#2e2a24;
  --px:"Press Start 2P",monospace;
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;
  padding-inline:12px;padding-block:12px 20px;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}

/* 像素邊框 */
.box{background:var(--panel);border:3px solid var(--edge);
  box-shadow:0 0 0 3px var(--hi), 0 10px 0 -2px rgba(0,0,0,.4);border-radius:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.hud .meter{display:flex;align-items:center;gap:8px;font-family:var(--px);font-size:11px;letter-spacing:.04em}
.hud .lbl{font-family:var(--sans);font-size:12px;color:var(--dim);letter-spacing:.08em}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:14px;background:var(--gold);display:block}
.pips i.off{background:#39424e}
.lamps{display:flex;gap:6px}
.lamp{width:30px;height:22px;display:grid;place-items:center;background:#39424e;color:#8e9aa8;
  font-family:var(--px);font-size:9px;border:2px solid var(--edge)}
.lamp.on{background:var(--green);color:#10331c}
.spacer{flex:1}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink);
  background:var(--panel2);border:2px solid var(--edge);box-shadow:0 3px 0 #0b0e12;border-radius:2px;padding:7px 12px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0e12}
.btn.gold{background:var(--gold);color:#2c2108}
.btn.ghost{background:transparent;border-color:var(--hi)}

/* 場景 */
.stage{position:relative;padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.place{font-family:var(--px);font-size:10px;color:var(--gold);letter-spacing:.06em;align-self:flex-start;padding:2px 4px}
canvas{image-rendering:pixelated;width:100%;height:auto;display:block;background:#0d1116;border:2px solid var(--edge)}
.hintline{font-size:12px;color:var(--dim);text-align:center}

/* 方向鍵 */
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;justify-content:center}
.pad button{background:var(--panel2);border:2px solid var(--edge);box-shadow:0 3px 0 #0b0e12;color:var(--ink);
  font-size:18px;border-radius:2px}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0e12}
.pad .mid{background:transparent;border:none;box-shadow:none;cursor:default}

/* 對話框 */
.dlg{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dlg .who{font-family:var(--px);font-size:10px;color:var(--gold);letter-spacing:.06em}
.dlg .text{font-size:16px;line-height:1.8;min-height:3.4em}
.dlg .text em{font-style:normal;color:var(--gold)}
.dlg .more{font-size:12px;color:var(--dim);text-align:right}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--edge);box-shadow:0 3px 0 #0b0e12;
  color:var(--ink);padding:10px 12px;line-height:1.6;border-radius:2px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0e12}
.opt .tag{display:inline-block;font-size:11px;color:var(--dim);margin-right:6px}

/* 覆蓋視窗 */
.sheet{position:fixed;inset:0;background:rgba(8,11,15,.86);display:flex;align-items:flex-start;
  justify-content:center;padding:16px;overflow:auto;z-index:20}
.sheet .inner{max-width:720px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--px);font-size:13px;color:var(--gold);margin:0;line-height:1.6}
.sheet h3{font-size:13px;letter-spacing:.14em;color:var(--dim);margin:0;font-weight:500}
.clue{border-left:3px solid var(--gold);background:var(--panel2);padding:10px 12px}
.clue b{display:block;font-size:14px}
.clue span{font-size:13px;color:var(--dim)}
.clue .src{font-family:var(--px);font-size:8px;color:var(--gold)}
.empty{color:var(--dim);font-size:14px}
.layer{border:2px solid var(--hi);padding:12px;display:flex;flex-direction:column;gap:10px}
.layer.done{border-color:var(--green);background:#1b2a20}
.layer .q{font-weight:700}
.choice{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:2px solid var(--edge);
  padding:8px 10px;cursor:pointer;line-height:1.6;font-size:14px}
.choice.sel{border-color:var(--gold);background:#3a3524}
.choice input{margin-top:5px;accent-color:#e3b95b}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:2px solid var(--edge);background:var(--panel2);padding:5px 9px;cursor:pointer}
.chip.sel{border-color:var(--gold);background:#3a3524}
.msg{font-size:13px;color:var(--red)}
.msg.ok{color:var(--green)}

/* 卷宗 */
.case{background:var(--paper);color:var(--paperink);border:3px solid var(--edge);box-shadow:0 0 0 3px #b9a67e;
  padding:22px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.85}
.case .stamp{font-family:var(--px);font-size:11px;color:#8a2f2a;border:3px double #8a2f2a;padding:6px 10px;
  align-self:flex-start;transform:rotate(-3deg)}
.case h1{font-family:var(--hand);font-size:30px;margin:0;line-height:1.3}
.case dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.case dt{color:#6b6350}
.case dd{margin:0}
.case .task{background:#e7dcc3;border-left:4px solid #8a7a52;padding:10px 14px}
.case .task b{display:block;margin-bottom:4px}
.case .warn{font-family:var(--hand);font-size:17px;border-top:1px dashed #b3a67e;padding-top:10px;color:#6b4a3a}
.case ol{margin:6px 0 0;padding-left:1.3em}
.case .ctrl{font-size:13px;color:#5c5748;background:#ece3cd;padding:10px 14px}

/* 結局 */
.ending{display:flex;flex-direction:column;gap:14px;padding:20px}
.ending .epi{font-family:var(--hand);font-size:20px;line-height:1.8}
.note-page{background:var(--paper);color:var(--paperink);padding:18px 20px;font-family:var(--hand);font-size:22px;
  border:3px solid var(--edge);box-shadow:0 0 0 3px #b9a67e;line-height:1.7}
.note-page small{display:block;font-family:var(--sans);font-size:12px;color:#6b6350;margin-bottom:6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--px);font-size:10px;color:var(--dim)}
.stats b{color:var(--gold)}
@media (max-width:520px){
  .case h1{font-size:24px}
  .sheet .inner{padding:14px}
}
</style>

const T = 16;
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

      px(x+2,y+11,7,1,'#7f9a8c'); break;
    case '.': px(x,y,T,T,'#8a6b4e'); px(x,y,T,1,'#7a5e45'); px(x+((tx+ty)%2?4:11),y,1,T,'#7a5e45'); break;
    case ',': px(x,y,T,T,'#5d8f4e'); px(x+2,y+3,2,2,'#6ea35c'); px(x+9,y+7,2,2,'#6ea35c'); px(x+5,y+12,2,1,'#4d7a41'); break;
    case 'd': case 'D': {
      const top = ch==='D' ? '#c9a063' : '#b98f57';
      px(x,y+3,T,9,top); px(x,y+3,T,2,'#d8b27c'); px(x+1,y+12,2,4,'#6b4e2e'); px(x+13,y+12,2,4,'#6b4e2e');
      if(ch==='D'){ px(x+3,y+6,10,4,'#e9dcc0'); }

    case 'l': px(x,y,T,T,'#4a3f3a'); px(x+1,y+1,14,14,'#5b7083'); px(x+1,y+1,14,1,'#6d8599'); px(x+8,y+1,1,14,'#44576a');
      px(x+5,y+7,2,2,'#2f3c49'); px(x+12,y+7,2,2,'#2f3c49'); break;

    case 's': px(x,y,T,T,'#6b4a33'); px(x,y+3,T,1,'#7d5a3f'); px(x,y+9,T,1,'#7d5a3f');
      px(x+3,y+4,2,4,'#5d8f4e'); px(x+10,y+10,2,4,'#5d8f4e'); break;

    case 'H': px(x,y,T,T,'#2f5c36'); px(x+2,y+2,4,4,'#3b7042'); px(x+9,y+6,4,4,'#3b7042'); px(x+4,y+10,5,4,'#3b7042'); break;
    case 'f': px(x,y,T,T,'#5d8f4e'); px(x+3,y+4,3,3,'#e6a3b5'); px(x+9,y+8,3,3,'#e3c45b'); px(x+6,y+2,2,2,'#e6a3b5'); break;
    default: px(x,y,T,T,'#8a6b4e');

}

function drawChar(cx, cy, pal, dir, step){
  const x = Math.round(cx*T), y = Math.round(cy*T);
  const bob = step ? 1 : 0;
  px(x+4, y+10-bob, 8, 5, pal.shirt);
  px(x+3, y+11-bob, 2, 3, pal.shirt);
  px(x+11, y+11-bob, 2, 3, pal.shirt);
  px(x+5, y+15-bob, 2, 1, '#2c2a28'); px(x+9, y+15-bob, 2, 1, '#2c2a28');
  px(x+4, y+3-bob, 8, 8, pal.skin);
  px(x+3, y+1-bob, 10, 4, pal.hair);
  px(x+3, y+3-bob, 2, 3, pal.hair); px(x+11, y+3-bob, 2, 3, pal.hair);
  if(dir !== 'up'){
    const ex = dir==='left' ? 4 : dir==='right' ? 6 : 5;
    px(x+ex, y+6-bob, 2, 2, '#2c2a28');
    px(x+ex+4, y+6-bob, 2, 2, '#2c2a28');
  }
}

let tick = 0;
function draw(){
  tick++;
  const m = map();
  cv.width = m[0].length*T; cv.height = m.length*T;
  ctx.imageSmoothingEnabled = false;
  for(let y=0;y<m.length;y++) for(let x=0;x<m[0].length;x++) drawTile(m[y][x], x, y);

  (SCENES[S.scene].objects||[]).forEach(o=>{
    if(S.seen[S.scene+o.name]) return;
    const f = Math.sin(tick/14)*1.5;
    px(o.x*T+6, o.y*T-5+Math.round(f), 4, 4, '#ffe9a8');
    px(o.x*T+7, o.y*T-6+Math.round(f), 2, 2, '#fff6d8');
  });
  (SCENES[S.scene].npcs||[]).forEach(n=>{
    drawChar(n.x, n.y, PAL[n.pal], 'down', Math.floor(tick/22)%2);
    if(!S.asked[S.scene+n.who]){
      const f = Math.sin(tick/14+1)*1.5;
      px(n.x*T+7, n.y*T-7+Math.round(f), 2, 4, '#ffe9a8');
      px(n.x*T+7, n.y*T-2+Math.round(f), 2, 2, '#ffe9a8');
    }
  });
  drawChar(S.px, S.py, PAL.player, S.dir, S.moving.length ? Math.floor(tick/5)%2 : 0);
  requestAnimationFrame(draw);
}

/* ============ 移動 ============ */
function bfs(sx, sy, tx, ty){
  const m = map(), W = m[0].length, H = m.length;
  const prev = new Map(), q = [[sx,sy]], seen = new Set([sx+','+sy]);
  while(q.length){
    const [x,y] = q.shift();
    if(x===tx && y===ty){
      const path = []; let k = x+','+y;
      while(k !== sx+','+sy){ const [a,b] = k.split(',').map(Number); path.unshift([a,b]); k = prev.get(k); }
      return path;
    }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, ny = y+dy, key = nx+','+ny;
      if(nx<0||ny<0||nx>=W||ny>=H||seen.has(key)||!walkable(nx,ny)) continue;
      seen.add(key); prev.set(key, x+','+y); q.push([nx,ny]);
    }
  }
  return null;
}
function stepAnim(){
  if(!S.moving.length){ S.anim = null; if(S.pending){ const p = S.pending; S.pending = null; p(); } return; }
  const [nx,ny] = S.moving.shift();
  S.dir = nx > S.px ? 'right' : nx < S.px ? 'left' : ny > S.py ? 'down' : 'up';
  S.px = nx; S.py = ny;
  S.anim = setTimeout(stepAnim, 110);
}
function goTo(tx, ty, then){
  if(S.phase !== 'play') return;
  const path = bfs(S.px, S.py, tx, ty);
  if(!path) return;
  S.moving = path; S.pending = then || null;
  if(!S.anim) stepAnim();
}
function approach(x, y, then){
  const spots = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b]) => walkable(a,b));
  if(!spots.length) return;
  if(spots.some(([a,b]) => a===S.px && b===S.py)){ then(); return; }
  spots.sort((p,q) => (Math.abs(p[0]-S.px)+Math.abs(p[1]-S.py)) - (Math.abs(q[0]-S.px)+Math.abs(q[1]-S.py)));
  goTo(spots[0][0], spots[0][1], then);
}

/* ============ 互動 ============ */
function spendAP(){
  S.ap--; updateHUD();
  if(S.ap <= 0){ setTimeout(()=>endGame('B', true), 600); }
}
function openObject(o){
  const key = S.scene + o.name;
  const first = !S.seen[key];
  if(first){ S.seen[key] = true; spendAP(); }
  const lines = o.lines.slice();
  if(o.clue && first) lines.push('【線索入手】' + CLUES[o.clue].title);
  if(o.clue) S.clues.add(o.clue);
  updateHUD();
  say(o.name, lines);
}
function openNPC(n){
  if(n.final){ finalScene(n); return; }
  say(n.who, [n.desc], () => askMenu(n));
}
function askMenu(n){
  const key = S.scene + n.who;
  showOptions(n.who, '你要怎麼問？', (n.qs||[]).map(q => ({
    label:'<span class="tag">'+q.type+'</span>'+q.q,
    run:()=>{
      spendAP(); S.asked[key] = true;
      if(q.clue) S.clues.add(q.clue);
      updateHUD();
      const lines = q.lines.slice();
      if(q.clue) lines.push('【線索入手】' + CLUES[q.clue].title);
      say(n.who, lines);
    }
  })).concat([{ label:'<span class="tag">離開</span>先不問了', run:()=>closeDialog() }]));
}

/* ============ 對話 UI ============ */
let dq = [], dafter = null;
function say(who, lines, after){
  S.phase = 'dialog'; dq = lines.slice(); dafter = after || null;
  $('#dlg').hidden = false; $('#dwho').textContent = who; $('#dopts').innerHTML = '';
  nextLine();
}
function nextLine(){
  if(!dq.length){
    if(dafter){ const f = dafter; dafter = null; f(); return; }
    closeDialog(); return;
  }
  const line = dq.shift();
  $('#dtext').innerHTML = line.replace(/【(.+?)】/g, '<em>【$1】</em>');
  $('#dmore').textContent = dq.length || dafter ? '▼ 點一下繼續' : '▼ 點一下關閉';
}
function showOptions(who, prompt, opts){
  S.phase = 'dialog';
  $('#dlg').hidden = false; $('#dwho').textContent = who; $('#dtext').textContent = prompt; $('#dmore').textContent = '';
  const box = $('#dopts'); box.innerHTML = '';
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt'; b.innerHTML = o.label;
    b.onclick = () => { box.innerHTML = ''; o.run(); };
    box.appendChild(b);
  });
}
function closeDialog(){ $('#dlg').hidden = true; $('#dopts').innerHTML = ''; if(S.phase==='dialog') S.phase = 'play'; }
$('#dlg').addEventListener('click', e => { if(e.target.closest('.opt')) return; if($('#dopts').children.length) return; nextLine(); });

/* ============ HUD ============ */
function updateHUD(){
  $('#apnum').textContent = String(S.ap).padStart(2,'0');
  $('#pips').innerHTML = Array.from({length:20}, (_,i) => '<i class="'+(i<S.ap?'':'off')+'"></i>').join('');
  $('#cluenum').textContent = S.clues.size + '/9';
  $('#lamps').innerHTML = LAYERS.map((L,i) => '<span class="lamp '+(S.layers[i]?'on':'')+'">'+L.name+'</span>').join('');
  $('#place').textContent = SCENES[S.scene].code;
}

function overlay(html, setup){
  const el = $('#overlay');
  el.innerHTML = '<div class="sheet"><div class="box inner">'+html+'</div></div>';
  el.querySelector('.sheet').addEventListener('click', e => { if(e.target.classList.contains('sheet')) closeOverlay(); });
  if(setup) setup(el);
}
function closeOverlay(){ $('#overlay').innerHTML = ''; }

function openBook(){
  const list = Object.keys(CLUES).filter(k => S.clues.has(k));
  const body = list.length ? LAYERS.map((L,i) => {
    const items = list.filter(k => CLUES[k].layer === i);
    if(!items.length) return '';
    return '<h3>第 '+L.name+' 層可能用得到</h3>' + items.map(k =>
      '<div class="clue"><b>'+CLUES[k].title+'</b><span>'+CLUES[k].text+'</span><span class="src">'+CLUES[k].src+'</span></div>').join('');
  }).join('') : '<p class="empty">還沒有收集到線索。去教室看看小禾的座位吧。</p>';
  overlay('<h2>CLUE BOOK　線索簿</h2><p class="empty">線索簿只記錄你「看到的事」。這代表什麼，要到推理板上才能下判斷。</p>'
    + body + '<button class="btn" id="x">關閉</button>',
    el => el.querySelector('#x').onclick = closeOverlay);
}

function openBoard(){
  const html = '<h2>DEDUCTION　推理板</h2>'
    + '<p class="empty">先選出你的結論，再勾出能支持這個結論的線索。兩個都對，這一層才會亮。</p>'
    + LAYERS.map((L,i) => {
        if(S.layers[i]) return '<div class="layer done"><div class="q">'+L.name+'. '+L.q+'</div><div>✔ '+L.opts[L.ans]+'</div><div class="msg ok">'+L.done+'</div></div>';
        return '<div class="layer" data-layer="'+i+'"><div class="q">'+L.name+'. '+L.q+'</div>'
          + L.opts.map((o,j)=>'<label class="choice"><input type="radio" name="L'+i+'" value="'+j+'"><span>'+o+'</span></label>').join('')
          + '<h3>支持這個結論的線索（選三條）</h3><div class="chips">'
          + Object.keys(CLUES).filter(k=>S.clues.has(k)).map(k=>'<span class="chip" data-k="'+k+'">'+CLUES[k].title+'</span>').join('')
          + '</div><button class="btn gold" data-submit="'+i+'">送出這一層</button><div class="msg" data-msg="'+i+'"></div></div>';
      }).join('')
    + '<button class="btn" id="x">關閉</button>';
  overlay(html, el => {
    el.querySelector('#x').onclick = closeOverlay;
    el.querySelectorAll('.chip').forEach(c => c.onclick = () => c.classList.toggle('sel'));
    el.querySelectorAll('.choice').forEach(c => c.onclick = () => {
      c.closest('.layer').querySelectorAll('.choice').forEach(o => o.classList.remove('sel'));
      c.classList.add('sel');
    });
    el.querySelectorAll('[data-submit]').forEach(b => b.onclick = () => {
      const i = +b.dataset.submit, L = LAYERS[i], box = b.closest('.layer');
      const msg = box.querySelector('[data-msg="'+i+'"]');
      const radio = box.querySelector('input[name="L'+i+'"]:checked');
      const picked = [...box.querySelectorAll('.chip.sel')].map(c => c.dataset.k);
      if(!radio){ msg.className = 'msg'; msg.textContent = '還沒有選結論。'; return; }
      if(picked.length !== 3){ msg.className = 'msg'; msg.textContent = '請選出三條線索。'; return; }
      const okClues = L.need.every(k => picked.includes(k));
      if(+radio.value !== L.ans){ msg.className = 'msg'; msg.textContent = '這些線索沒辦法支持這個結論。再看一次線索簿？'; return; }
      if(!okClues){ msg.className = 'msg'; msg.textContent = '結論的方向對了，但有線索不能當證據。再想想哪三條？'; return; }
      S.layers[i] = true; updateHUD();
      if(S.layers.every(Boolean)){
        closeOverlay();
        say('推理板', ['三層都亮了。','你知道她在意什麼，也知道她為什麼走了。','現在的問題只剩一個——她會去哪裡？',
          '一個沒有人會催她的地方。','【地圖解鎖】展演台後的小花園'], () => { closeDialog(); openMap(); });
      } else { openBoard(); }
    });
  });
}

function openMap(){
  const places = Object.keys(SCENES).filter(k => !SCENES[k].locked || S.layers.every(Boolean));
  overlay('<h2>MAP　晨星國小</h2><p class="empty">走路不花時間。點一個地方過去。</p>'
    + places.map(k => '<button class="btn" data-go="'+k+'" style="text-align:left">'
        + (k===S.scene ? '▶ ' : '　') + SCENES[k].name + '</button>').join('')
    + '<button class="btn ghost" id="x">關閉</button>',
    el => {
      el.querySelector('#x').onclick = closeOverlay;
      el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
        const k = b.dataset.go; closeOverlay();
        if(k === S.scene) return;
        S.scene = k; S.px = SCENES[k].start[0]; S.py = SCENES[k].start[1]; S.moving = []; S.pending = null;
        updateHUD();
        if(k === 'flower') say('小花園', ['穿過展演台後面，有一小塊沒什麼人會來的草地。','小禾坐在長椅旁邊。']);
      });
    });
}

function openHint(){
  let h;
  if(S.clues.size < 3) h = '先從教室開始：她的座位、黑板上的名單、垃圾桶。發亮的東西都可以點。';
  else if(!S.clues.has('B3')) h = '小雨說她往樓下走。樓下有什麼地方，是她負責照顧的？';
  else if(!S.layers[1] && S.layers[0]) h = '如果她只是想一個人安靜，那張寫到一半的紙條，是要給誰的？';
  else if(!S.layers[2] && S.layers[1]) h = '阿豪、小安，他們是故意要排擠她嗎？去聽聽他們自己怎麼說。';
  else if(!S.layers.every(Boolean)) h = '打開推理板，先選結論，再挑出三條能當證據的線索。';
  else h = '三層都亮了。打開地圖，去小花園。';
  overlay('<h2>HINT　提示</h2><p>'+h+'</p><button class="btn" id="x">關閉</button>',
    el => el.querySelector('#x').onclick = closeOverlay);
}

/* ============ 結局 ============ */
function finalScene(n){
  say('小禾', [n.desc, '她看到你，沒有站起來，也沒有說話。'], () => {
    showOptions('你', '你要說什麼？', FINAL_OPTS.map(o => ({
      label:o.text, run:()=>pickFinal(o)
    })));
  });
}
function pickFinal(o){
  if(o.type === 'hit') return endGame('A');
  if(o.type === 'surface') return say('小禾', ['她搖搖頭，小聲說：「我沒有不舒服。」','她把那張紙折得更小了。'], ()=>endGame('B'));
  if(o.type === 'none') return say('小禾', ['她看了一下手錶，點點頭。','「嗯。」'], ()=>endGame('B'));
  say('小禾', ['她的肩膀縮了一下。','「⋯對不起。」','她把那張紙塞進口袋。'], () => {
    showOptions('你', '說錯了。你還有一次機會。', REPAIR_OPTS.map(r => ({
      label:r.text, run:()=>{
        if(r.type === 'repair'){ S.repaired = true; return say('小禾', ['她看著你，過了很久。','然後她往旁邊挪了一點，空出一個位子。'], ()=>endGame('A')); }
        if(r.type === 'explain') return say('小禾', ['「我知道。對不起。」','她站起來，拍了拍裙子上的草。'], ()=>endGame('C'));
        return say('小禾', ['「⋯好。」','她點點頭。那張紙，一直沒有拿出來。'], ()=>endGame('C'));
      }
    })));
  });
}
function endGame(code, timeout){
  S.phase = 'end'; closeDialog(); closeOverlay();
  const e = ENDINGS[code];
  $('#hud').hidden = true; $('#stage').hidden = true;
  const pre = timeout ? '<p class="empty">午休結束的鐘聲響了。你還沒找到她。<br>回到教室的時候，小禾已經坐在位子上了。</p>' : '';
  $('#overlay').innerHTML = '<div class="sheet"><div class="box inner ending">'
    + '<h2>ENDING '+code+'</h2>' + pre
    + '<p class="epi">'+e.epi.replace(/\n/g,'<br>')+'</p>'
    + '<div class="note-page"><small>她筆記本的最後一頁</small>'+e.note+'</div>'
    + '<div class="stats"><span>線索 <b>'+S.clues.size+'/9</b></span><span>推理 <b>'+S.layers.filter(Boolean).length+'/3</b></span>'
    + '<span>剩餘時間 <b>'+Math.max(0,S.ap)+'</b></span>'+(S.repaired?'<span><b>修復徽章</b></span>':'')+'</div>'
    + '<p class="empty">這裡沒有壞人。阿豪、小安、阿凱，每個人都只是說了一句自己早就忘記的話。<br>'
    + '放在一起，就變成了她今天中午的那個決定。</p>'
    + '<button class="btn gold" id="again">再玩一次</button></div></div>';
  $('#again').onclick = () => location.reload();
}

/* ============ 輸入 ============ */
cv.addEventListener('click', ev => {
  if(S.phase !== 'play') return;
  const r = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - r.left) / (r.width / cv.width) / T);
  const y = Math.floor((ev.clientY - r.top) / (r.height / cv.height) / T);
  const n = npcAt(x,y), o = objAt(x,y);
  if(n) return approach(x, y, () => openNPC(n));
  if(o) return approach(x, y, () => openObject(o));
  if(walkable(x,y)) goTo(x,y);
});
function stepDir(dx, dy){
  if(S.phase !== 'play' || S.moving.length) return;
  const nx = S.px+dx, ny = S.py+dy;
  S.dir = dx>0?'right':dx<0?'left':dy>0?'down':'up';
  const n = npcAt(nx,ny), o = objAt(nx,ny);
  if(n) return openNPC(n);
  if(o) return openObject(o);
  if(walkable(nx,ny)){ S.px = nx; S.py = ny; }
}
$('#pad').addEventListener('click', e => {
  const d = e.target.dataset.dir; if(!d) return;
  const [dx,dy] = d.split(',').map(Number); stepDir(dx,dy);
});
addEventListener('keydown', e => {
  const k = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(k){ e.preventDefault(); stepDir(k[0],k[1]); }
  if(e.key === ' ' && S.phase === 'dialog' && !$('#dopts').children.length) nextLine();
});
$('#btn-map').onclick = openMap;
$('#btn-book').onclick = openBook;
$('#btn-board').onclick = openBoard;
$('#btn-hint').onclick = openHint;

/* ============ 卷宗 ============ */

  $('#overlay').innerHTML = '<div class="sheet"><div class="case">'
    + '<span class="stamp">CASE 1014</span>'
    + '<h1>午休失蹤檔案</h1>'
    + '<dl><dt>時間</dt><dd>十月十四日　13:35　午休結束</dd>'
    + '<dt>地點</dt><dd>晨星國小　合心樓三樓　五年三班</dd>'
    + '<dt>對象</dt><dd>林若禾（小禾）・五年三班</dd></dl>'
    + '<p>午休鐘響，全班回到座位。只有她的位子是空的。</p>'
    + '<p>書包還掛在椅子上。抽屜裡留著一本沒帶走的筆記本。</p>'
    + '<div class="task"><b>你的任務</b><ol>'
    + '<li>在校園裡找出九條線索</li>'
    + '<li>拼出三件事：大家眼中的她、她真正在意的、最後一根稻草</li>'
    + '<li>找到她，然後決定要對她說什麼</li></ol></div>'
    + '<p class="warn">注意：這裡沒有壞人。每個人都只是說了一句，自己早就忘記的話。</p>'
    + '<div class="ctrl"><b>怎麼玩</b><br>點地板走過去，點發亮的東西觀察，點同學問話。也可以用下面的方向鍵。<br>'
    + '午休只剩 <b>20 格</b>時間。走路不花時間，觀察和問話各花 1 格。</div>'
    + '<button class="btn gold" id="start">開始調查</button></div></div>';
  $('#start').onclick = () => {
    closeOverlay();
    S.phase = 'play'; $('#hud').hidden = false; $('#stage').hidden = false;
    S.scene = 'classroom'; S.px = SCENES.classroom.start[0]; S.py = SCENES.classroom.start[1];
    updateHUD();
    say('你', ['你站在教室後面。','小禾的位子就在前面第二排，空的。','她的書包還掛在椅子上。']);
  };
}
caseFile();
draw();
</script>
