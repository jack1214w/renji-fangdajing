<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人際放大鏡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F3F4EF; --sheet:#FFFFFD; --ink:#2A2E33; --pencil:#656C74; --line:#DCDFD7;
  --wash:#4A76A8; --wash-soft:#E2EAF3; --sun:#B07D14; --sun-soft:#F6EBD2;
  --good:#437F53; --good-soft:#E1EEE3; --bad:#B24E48; --bad-soft:#F5E0DD;
  --mute:#6E747B; --mute-soft:#ECEDE8;
  --skin:#F3D8C1; --hair:#2F2A28; --blush:#EFA99A; --shirt2:#8FAE8C; --clip:#FFFFFF; --shirt3:#C98A5B; --band:#D06A78; --shirt4:#9B87B8; --shirt5:#3F5078; --shirt6:#D2A94E;
  --shadow:0 1px 2px rgba(40,50,60,.06),0 8px 24px -12px rgba(40,60,90,.18);
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1F24; --sheet:#242931; --ink:#E8EAE5; --pencil:#A5ACB4; --line:#363C45;
    --wash:#8FB1DA; --wash-soft:#29384A; --sun:#E3B95B; --sun-soft:#3A3122;
    --good:#88C497; --good-soft:#233429; --bad:#E78C85; --bad-soft:#3E2826;
    --mute:#A0A6AD; --mute-soft:#2C3139;
    --skin:#E6C6AA; --hair:#141110; --blush:#C77A6D; --shirt2:#6E8F6B; --clip:#DCE6F2; --shirt3:#A8744F; --band:#C77883; --shirt4:#7F6E9E; --shirt5:#5A6C9C; --shirt6:#B08E3F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1F24; --sheet:#242931; --ink:#E8EAE5; --pencil:#A5ACB4; --line:#363C45;
  --wash:#8FB1DA; --wash-soft:#29384A; --sun:#E3B95B; --sun-soft:#3A3122;
  --good:#88C497; --good-soft:#233429; --bad:#E78C85; --bad-soft:#3E2826;
  --mute:#A0A6AD; --mute-soft:#2C3139;
  --skin:#E6C6AA; --hair:#141110; --blush:#C77A6D; --shirt2:#6E8F6B; --clip:#DCE6F2; --shirt3:#A8744F; --band:#C77883; --shirt4:#7F6E9E; --shirt5:#5A6C9C; --shirt6:#B08E3F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:
    radial-gradient(60rem 30rem at 110% -10%, var(--wash-soft), transparent 60%),
    radial-gradient(40rem 24rem at -20% 110%, var(--sun-soft), transparent 60%),
    var(--paper);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px; line-height:1.75;
  padding-inline:16px; padding-block:28px 56px;
  min-height:100%;
}
.wrap{max-width:660px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--hand);font-weight:700;font-size:1.65rem;letter-spacing:.06em;margin:0;line-height:1.2}
.brand h1 .lens{color:var(--wash)}
.brand .chap{font-size:.82rem;color:var(--pencil);letter-spacing:.12em}

/* status */
.status{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:.74rem;color:var(--pencil);letter-spacing:.08em}
.stat .val{font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--mute-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--wash),color-mix(in srgb,var(--wash) 60%,var(--good)));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lensdots{display:flex;gap:6px}
.lensdots svg{width:20px;height:20px;color:var(--wash)}
.lensdots svg.used{opacity:.25}
@media (max-width:480px){.status{grid-template-columns:1fr 1fr}.status .stat:first-child{grid-column:1/-1}}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:18px}
@media (max-width:480px){.sheet{padding:18px 16px}}
.eyebrow{font-size:.78rem;letter-spacing:.16em;color:var(--wash);font-weight:500}
.sheet h2{font-family:var(--hand);font-size:1.5rem;margin:0;line-height:1.35;text-wrap:balance;font-weight:700}
.sheet h2:focus{outline:none}
.narr p{margin:0 0 .5em}
.narr p:last-child{margin:0}

.meet{display:flex;gap:16px;align-items:center}
.face{flex:none;width:92px;height:92px;border-radius:50%;background:var(--wash-soft);display:grid;place-items:center;overflow:hidden}
.face svg{width:100%;height:100%}
.face svg *{transition:d .5s ease, opacity .5s ease, transform .5s ease}
.meet .who{display:flex;flex-direction:column;gap:2px}
.meet .who b{font-size:1.1rem}
.meet .who span{font-size:.85rem;color:var(--pencil)}

.clue{border-left:3px solid var(--sun);background:var(--sun-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
.clue .t{font-size:.75rem;letter-spacing:.12em;color:var(--sun);font-weight:700;display:block;margin-bottom:2px}

/* trait card */
.trait{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.trait-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.trait-head b{font-size:.9rem;letter-spacing:.06em}
.trait dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
.trait dt{color:var(--pencil);white-space:nowrap}
.trait dd{margin:0}
.locked{color:transparent;text-shadow:0 0 7px color-mix(in srgb,var(--ink) 55%,transparent);user-select:none}
.revealed{animation:reveal .7s ease both}
@keyframes reveal{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}

button{font:inherit;cursor:pointer}
.lensbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wash);color:var(--wash);background:transparent;border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:500}
.lensbtn:hover:not(:disabled){background:var(--wash-soft)}
.lensbtn:disabled{opacity:.4;cursor:not-allowed}
.lensbtn svg{width:16px;height:16px}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choices .q{font-size:.85rem;color:var(--pencil);letter-spacing:.06em}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.6;transition:border-color .15s,background .15s,transform .15s}
.choice:hover{border-color:var(--wash);background:var(--wash-soft)}
.choice:active{transform:scale(.99)}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--pencil);color:var(--pencil);font-size:.78rem;display:grid;place-items:center;margin-top:2px;font-weight:700}
.choice:hover .k{border-color:var(--wash);color:var(--wash)}

:focus-visible{outline:2.5px solid var(--wash);outline-offset:2px}

/* result */
.said,.act,.lede{margin:0}
.said{font-size:.95rem;color:var(--pencil)}
.said q{color:var(--ink);quotes:"「" "」"}
.act{font-size:.95rem;color:var(--pencil);font-style:normal}
.thought{position:relative;font-family:var(--hand);font-size:1.45rem;line-height:1.6;padding:22px 24px 20px;border-radius:28px;background:
  radial-gradient(120% 90% at 20% 10%, color-mix(in srgb,var(--wash-soft) 100%,transparent), transparent 70%),
  radial-gradient(90% 80% at 90% 100%, color-mix(in srgb,var(--sun-soft) 90%,transparent), transparent 70%),
  var(--paper);
  border:1px solid var(--line);margin-left:22px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both .15s}
.thought.hurt{background:radial-gradient(120% 90% at 20% 10%, var(--bad-soft), transparent 70%),var(--paper)}
.thought .who{display:block;font-family:var(--sans);font-size:.75rem;letter-spacing:.14em;color:var(--pencil);margin-bottom:4px}
.thought::before,.thought::after{content:"";position:absolute;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.thought::before{width:16px;height:16px;left:-14px;top:30px}
.thought::after{width:9px;height:9px;left:-26px;top:50px}
@media (max-width:480px){.thought{font-size:1.25rem;padding:18px 18px 16px}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:.85rem;font-weight:700;letter-spacing:.04em}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.sun{background:var(--sun-soft);color:var(--sun)}
.chip.mute{background:var(--mute-soft);color:var(--mute)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.delta{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;animation:pop .5s ease both .5s}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.zero{color:var(--mute)}
.delta small{font-weight:500;color:var(--pencil);font-size:.8rem;margin-left:4px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:none}}
.note{font-size:.92rem;background:var(--mute-soft);border-radius:12px;padding:12px 14px}
.note b{display:block;font-size:.75rem;letter-spacing:.14em;color:var(--pencil);margin-bottom:2px}

.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:none;border-radius:99px;padding:10px 22px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--sheet);transition:transform .15s,opacity .15s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.97)}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--bad);color:var(--sheet)}

/* intro */
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.rules li{display:flex;gap:10px;align-items:baseline}
.rules .chip{flex:none;min-width:5.6em;justify-content:center}
.lede{font-family:var(--hand);font-size:1.15rem;line-height:1.7}

/* end */
.tiers{border-collapse:collapse;width:100%;font-size:.9rem}
.tiers th,.tiers td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tiers th{font-weight:500;color:var(--pencil);font-size:.78rem;letter-spacing:.08em}
.tiers td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tiers tr.on td{background:var(--wash-soft);font-weight:700}
.tablebox{overflow-x:auto}
.bigrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.big .lbl{font-size:.75rem;color:var(--pencil);letter-spacing:.08em}
.big .n{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
@media (max-width:480px){.bigrow{grid-template-columns:1fr 1fr}.bigrow .big:last-child{grid-column:1/-1}}
.badge{display:flex;gap:12px;align-items:center;background:var(--sun-soft);border-radius:14px;padding:12px 14px}
.badge svg{flex:none;width:40px;height:40px}
.badge b{display:block}
.badge span{font-size:.88rem;color:var(--pencil)}
.epi{font-family:var(--hand);font-size:1.3rem;line-height:1.7;margin:0;padding:6px 0 6px 16px;border-left:3px solid var(--wash)}

details.rev{border:1px solid var(--line);border-radius:14px;padding:4px 14px}
details.rev summary{cursor:pointer;padding:10px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.rev summary::-webkit-details-marker{display:none}
details.rev summary::after{content:"＋";color:var(--pencil);font-weight:400}
details.rev[open] summary::after{content:"－"}
.revlist{display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.revitem{border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:4px;border:1px solid transparent}
.revitem.mine{border-color:var(--wash)}
.revitem .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.revitem .line{font-size:.93rem}
.revitem .th{font-family:var(--hand);font-size:1.08rem;color:var(--pencil)}
.revitem .mine-tag{font-size:.72rem;color:var(--wash);font-weight:700;letter-spacing:.1em}
.revsub{font-size:.78rem;letter-spacing:.12em;color:var(--pencil);margin-top:4px}
.qs{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
h3{font-size:.8rem;letter-spacing:.16em;color:var(--pencil);font-weight:500;margin:0}

.lens-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border:1.5px dashed var(--wash);border-radius:16px;padding:16px;background:var(--wash-soft)}
.lens-cta b{display:block;font-family:var(--hand);font-size:1.2rem}
.lens-cta span{font-size:.88rem;color:var(--pencil)}
.lens-go{display:inline-flex;align-items:center;gap:8px;background:var(--wash);color:var(--sheet)}
.lens-go svg{width:18px;height:18px}
.lens-full{display:flex;flex-direction:column;gap:10px;outline:none}
.lens-full h3{display:flex;align-items:center;gap:6px;color:var(--wash)}
.lens-full h3 svg{width:16px;height:16px}
.chapters{display:flex;flex-direction:column;gap:10px}
.chap-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.chap-list{grid-template-columns:1fr}}
.chap-card{display:flex;gap:10px;align-items:center;min-width:0;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.chap-card:hover{border-color:var(--wash)}
.chap-card.on{border-color:var(--wash);background:var(--wash-soft)}
.chap-card .face{width:52px;height:52px}
.chap-card small{display:block;font-size:.75rem;letter-spacing:.12em;color:var(--pencil)}
.chap-card b{display:block;font-family:var(--hand);font-size:1.2rem;line-height:1.3}
.chap-card em{display:block;font-style:normal;font-size:.82rem;color:var(--pencil)}
.chap-card.on b{color:var(--wash)}
.modes-wrap{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;line-height:1.55}
.mode b{display:flex;align-items:center;gap:6px}
.mode span{font-size:.85rem;color:var(--pencil)}
.mode .lock{width:15px;height:15px;color:var(--pencil)}
.mode:hover{border-color:var(--wash)}
.mode.on{border-color:var(--wash);background:var(--wash-soft)}
.mode.on b{color:var(--wash)}
.pw{display:flex;flex-direction:column;gap:8px;background:var(--sun-soft);border-radius:14px;padding:14px}
.pw label{font-size:.9rem;font-weight:500}
.pw-row{display:flex;gap:8px;flex-wrap:wrap}
.pw input{flex:1 1 8em;min-width:0;font:inherit;font-size:1.1rem;letter-spacing:.3em;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
.pw input[aria-invalid="true"]{border-color:var(--bad)}
.pw-err{font-size:.85rem;color:var(--bad);font-weight:500}
.lens-hint{margin:0;font-size:.88rem;color:var(--pencil)}
.lens-layer{border-radius:14px;padding:12px 12px 12px 16px;background:var(--paper);border:1px solid var(--line);display:grid;grid-template-columns:5.5em 1fr auto;gap:14px;align-items:center}
.lens-layer.enter{animation:reveal .7s ease both;animation-delay:calc(var(--i)*.2s)}
.lens-layer .tag{font-size:.75rem;letter-spacing:.12em;color:var(--pencil)}
.lens-layer .body{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.lens-layer b{font-family:var(--hand);font-size:1.3rem}
.lens-layer p{margin:0;font-size:.93rem}
.lens-layer .ask{font-family:var(--hand);font-size:1.1rem;color:var(--ink)}
.lens-layer .blur{display:flex;flex-direction:column;gap:2px;filter:blur(7px);opacity:.55;user-select:none;pointer-events:none}
.lens-layer.core{background:var(--wash-soft);border-color:var(--wash)}
.lens-layer.core .tag{color:var(--wash)}
.lens-layer.warn{background:var(--bad-soft);border-color:transparent}
.lens-layer.warn .tag{color:var(--bad)}
.peek{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--wash);background:var(--sheet);color:var(--wash);display:grid;place-items:center;transition:transform .2s,background .2s}
.peek svg{width:22px;height:22px}
.peek:hover{background:var(--wash);color:var(--sheet);transform:rotate(-12deg) scale(1.06)}
@media (max-width:480px){.lens-layer{grid-template-columns:1fr auto}.lens-layer .tag{grid-column:1/-1}}
.foot{font-size:.78rem;color:var(--pencil);text-align:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="wrap">
  <header class="brand">
    <h1>人際<span class="lens">放大鏡</span></h1>
    <span class="chap" id="chap">第一章・小宇</span>
  </header>
  <div id="status" class="status" hidden></div>
  <main id="stage" class="sheet" aria-live="polite"></main>
  <p class="foot">試玩版・內容為教學示範情境</p>
</div>

<script>
const LENS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/><path d="M8 8.5a3 3 0 0 1 3-2" opacity=".6"/></svg>';
const LOCK_ICON = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-label="需要教師密碼"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const NUM = ['一','二','三','四','五','六'];

const TYPES = {
  hit:{label:'精準命中',cls:'good'},
  surface:{label:'命中表面',cls:'sun'},
  none:{label:'無關',cls:'mute'},
  harm:{label:'踩雷',cls:'bad'},
  repair:{label:'有效修補',cls:'good'},
  explain:{label:'無效修補・解釋自己',cls:'bad'},
  trade:{label:'無效修補・討好交換',cls:'mute'},
  delay:{label:'無效修補・延後處理',cls:'mute'}
};

const TIERS = [
  {min:70,label:'70 以上',acct:30,start:60},
  {min:40,label:'40 – 69',acct:10,start:50},
  {min:-1,label:'39 以下',acct:-20,start:35}
];

const TEACHER_CHAPTERS = [
  {
    id:'yu', name:'小宇', pron:'他', full:'小宇（林宇恩）・五年級', tagline:'很會畫畫的安靜男孩',
    desc:'安靜，很會畫畫，常常一個人待在教室。大家都說他是「天生的畫家」。',
    headline:'每個人心裡，都有一件希望被看見的事。',
    lede:'接下來三個場景，你會遇見小宇。選一句你覺得最適合的話，然後看看他心裡怎麼想。',
    traits:[
      {cls:'',tag:'表面特質',b:'創造力',p:'大家看到的小宇：很會畫畫，是「天生的畫家」。',ask:'猜猜看：大家眼中的小宇，是什麼樣的人？'},
      {cls:'core',tag:'真正在意的',b:'毅力',p:'他希望有人看見他「練了很久」，而不只是「很有天分」。',ask:'猜猜看：小宇最希望別人看見他的什麼？'},
      {cls:'warn',tag:'雷區',b:'被否定努力',p:'被說「天生的」、被拿來比較、被說不用那麼認真。',ask:'猜猜看：什麼樣的話，會讓小宇受傷？'}

const clamp = n => Math.max(0,Math.min(100,n));
const $ = s => document.querySelector(s);
const moodFromEnergy = e => e>=70?'happy':e>=40?'calm':'down';

function face(mood, who=C().id){
  const H = 'var(--hair)';
  const line = d => `<path d="${d}" stroke="${H}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const brow = d => `<path d="${d}" stroke="${H}" stroke-width="2.4" stroke-linecap="round"/>`;
  const dot = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${H}"/>`;
  const eyes = {
    happy: line('M40 60 Q46 54 52 60')+line('M68 60 Q74 54 80 60'),
    shy:   line('M40 61 Q46 56 52 61')+line('M68 61 Q74 56 80 61'),
    calm:  dot(46,60,3.4)+dot(74,60,3.4),
    down:  dot(46,64,3.2)+dot(74,64,3.2)+brow('M39 54 L52 57')+brow('M81 54 L68 57'),
    hurt:  dot(43,63,3.2)+dot(71,63,3.2)+brow('M38 55 L51 53')+brow('M66 53 L79 55'),
    cover: line('M41 57 L51 61 L41 65')+line('M79 57 L69 61 L79 65'),
    bored: line('M40 60 L52 60')+line('M68 60 L80 60')+dot(46,62.5,2.4)+dot(74,62.5,2.4),
    tense: dot(46,61,3.2)+dot(74,61,3.2)+brow('M39 55 L51 51')+brow('M81 55 L69 51'),
    excited: dot(46,60,4.4)+dot(74,60,4.4)+`<circle cx="47.6" cy="58.4" r="1.4" fill="var(--clip)"/><circle cx="75.6" cy="58.4" r="1.4" fill="var(--clip)"/>`,
    frozen: `<circle cx="46" cy="60" r="4.6" fill="var(--clip)" stroke="${H}" stroke-width="2"/><circle cx="74" cy="60" r="4.6" fill="var(--clip)" stroke="${H}" stroke-width="2"/>`+dot(46,60,1.8)+dot(74,60,1.8)
  }[mood];
  const mouth = {happy:'M50 79 Q60 88 70 79',shy:'M53 81 Q60 85 67 81',calm:'M52 82 Q60 84 68 82',down:'M52 86 Q60 80 68 86',hurt:'M53 84 L66 83',cover:'M52 85 Q56 82 60 85 Q64 88 68 85',bored:'M52 84 Q61 84 68 79',tense:'M53 84 Q56 82 60 84 Q64 86 67 84',excited:'M51 79 Q60 92 69 79 Q60 83 51 79',frozen:'M57.5 84 Q60 80.5 62.5 84 Q60 87.5 57.5 84'}[mood];
  const blush = (mood==='happy'||mood==='shy'||mood==='excited')?.7:0;
  const ears = `<circle cx="27" cy="66" r="6" fill="var(--skin)"/><circle cx="93" cy="66" r="6" fill="var(--skin)"/>`;
  const head = r => `<circle cx="60" cy="64" r="${r}" fill="var(--skin)"/>`;
  const shirt = c => `<path d="M22 124 Q60 94 98 124Z" fill="${c}"/>`;
  const bodies = {
    yu: `${shirt('var(--wash)')}${ears}${head(33)}
      <path d="M26 62 Q23 27 59 25 Q95 24 95 60 Q88 45 76 42 Q71 51 63 44 Q56 53 48 45 Q38 51 26 62Z" fill="${H}"/>
      <rect x="88" y="44" width="5" height="26" rx="1.5" transform="rotate(28 90 57)" fill="var(--sun)"/>`,
    qing: `${shirt('var(--shirt2)')}
      <path d="M24 66 Q20 22 60 21 Q100 22 96 66 L99 106 Q86 114 78 104 L42 104 Q34 114 21 106Z" fill="${H}"/>
      ${head(32)}
      <path d="M28 60 Q27 29 60 28 Q93 29 92 60 Q84 44 70 43 Q62 50 52 43 Q38 46 28 60Z" fill="${H}"/>
      <g transform="translate(77 37)" fill="var(--clip)"><circle cx="0" cy="3" r="3.6"/><circle cx="4.8" cy="0" r="4.8"/><circle cx="9.6" cy="3" r="3.6"/><rect x="0" y="3" width="9.6" height="3.6"/></g>`,
    kai: `${shirt('var(--shirt3)')}
      <path d="M50 101 L60 110 L70 101" stroke="var(--sheet)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <path d="M60 110 L60 124" stroke="var(--sheet)" stroke-width="2" stroke-dasharray="2 2"/>
      ${ears}${head(33)}
      <path d="M26 60 Q24 36 38 29 L41 19 L49 26 L55 16 L62 24 L70 17 L74 27 Q95 32 94 60 Q88 47 77 45 Q68 49 58 44 Q46 49 37 45 Q30 50 26 60Z" fill="${H}"/>
      <path d="M58 20 Q54 8 65 6" stroke="${H}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
    yun: `${shirt('var(--shirt4)')}
      <path d="M50 101 Q60 108 70 101" stroke="var(--clip)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M86 34 Q106 40 101 64 Q98 82 88 90 Q95 68 86 48Z" fill="${H}"/>
      ${ears}${head(32)}
      <path d="M28 60 Q26 28 60 27 Q94 28 92 60 Q88 44 76 40 Q60 35 44 40 Q31 46 28 60Z" fill="${H}"/>
      <path d="M30 47 Q60 25 90 47" stroke="var(--band)" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
    xiang: `${shirt('var(--shirt5)')}
      <path d="M60 106 L62.4 111.6 L68.4 112 L63.8 115.8 L65.3 121.6 L60 118.4 L54.7 121.6 L56.2 115.8 L51.6 112 L57.6 111.6Z" fill="var(--sun)"/>
      ${ears}${head(33)}
      <g fill="${H}"><circle cx="31" cy="52" r="8.5"/><circle cx="37" cy="39" r="9.5"/><circle cx="49" cy="30" r="10"/><circle cx="63" cy="28" r="10"/><circle cx="76" cy="33" r="9.5"/><circle cx="86" cy="44" r="9"/><circle cx="90" cy="55" r="7"/>
      <path d="M28 58 Q34 40 60 38 Q86 40 92 58 Q82 46 70 47 Q60 42 50 47 Q38 46 28 58Z"/></g>`,
    he: `${shirt('var(--shirt6)')}
      <path d="M24 64 Q20 24 60 22 Q100 24 96 64 L97 88 Q88 94 82 86 L38 86 Q32 94 23 88Z" fill="${H}"/>
      ${head(32)}
      <path d="M28 54 Q26 26 60 25 Q94 26 92 54 Z" fill="${H}"/>`
  };
  const hands = mood==='cover' ? `
    <ellipse cx="27" cy="66" rx="8.5" ry="11.5" fill="var(--skin)" stroke="${H}" stroke-opacity=".35" stroke-width="1.5"/>
    <ellipse cx="93" cy="66" rx="8.5" ry="11.5" fill="var(--skin)" stroke="${H}" stroke-opacity=".35" stroke-width="1.5"/>` : '';
  const name = ALL_CHAPTERS.find(c=>c.id===who).name;
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${name}的表情">
    ${bodies[who]}
    <circle cx="40" cy="72" r="6" fill="var(--blush)" opacity="${blush}"/><circle cx="80" cy="72" r="6" fill="var(--blush)" opacity="${blush}"/>
    ${eyes}
    <path d="${mouth}" stroke="${H}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    ${hands}
  </svg>`;
}

function renderStatus(){
  $('#chap').textContent = `第${NUM[state.ch]}章・${C().name}`;
  const el = $('#status');
  if(state.phase==='intro'){el.hidden=true;return}
  el.hidden=false;
  const lenses = Array.from({length:state.lensMax},(_,i)=>LENS_ICON.replace('<svg',`<svg class="${i<state.lensUsed?'used':''}"`)).join('');
  el.innerHTML = `
    <div class="stat"><span class="lbl">${C().name}的心理能量</span>
      <span class="val">${state.energy}<small style="color:var(--pencil);font-weight:400">/ 100</small></span>
      <div class="bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.energy}" aria-label="${C().name}的心理能量"><i style="width:${state.energy}%"></i></div></div>
    <div class="stat"><span class="lbl">友感帳戶</span><span class="val">${state.account}</span><span class="lbl">${state.phase==='end'?'已結算':'章末結算'}</span></div>
    ${isClass()
      ? `<div class="stat"><span class="lbl">模式</span><span class="val">課堂模式</span><span class="lbl">特質留到結局揭曉</span></div>`
      : `<div class="stat"><span class="lbl">放大鏡</span><span class="lensdots" aria-label="剩下 ${state.lensMax-state.lensUsed} 次">${lenses}</span><span class="lbl">剩 ${state.lensMax-state.lensUsed} 次</span></div>`}`;
}

function traitCard(){
  const T = C().traits;
  const l1 = state.lensUsed>=1, l2 = state.lensUsed>=2;
  const can = state.lensUsed<state.lensMax && state.phase==='scene';
  const lock = t => `<span class="locked" aria-label="尚未揭曉">${t}</span>`;
  return `<section class="trait" aria-label="特質卡">
    <div class="trait-head"><b>${C().name}的特質卡</b>
      <button class="lensbtn" id="lensbtn" ${can?'':'disabled'}>${LENS_ICON}用放大鏡觀察</button></div>
    <dl>
      <dt>${T[0].tag}</dt><dd class="${l1?'revealed':''}">${l1?T[0].b:lock(T[0].b+'很好')}</dd>
      <dt>${T[1].tag}</dt><dd class="${l1?'revealed':''}">${l1?`<b>${T[1].b}</b>：${T[1].p}`:lock(T[1].p)}</dd>
      <dt>${T[2].tag}</dt><dd class="${l2?'revealed':''}">${l2?T[2].p:lock(T[2].p)}</dd>
    </dl>
  </section>`;
}

function render(){
  renderStatus();
  const st = $('#stage');
  const p = state.phase;
  if(p==='intro') st.innerHTML = introView();
  else if(p==='scene') st.innerHTML = sceneView();
  else if(p==='result'||p==='repairResult') st.innerHTML = resultView();
  else if(p==='repair') st.innerHTML = repairView();
  else if(p==='end') st.innerHTML = endView();
  bind();
  const h = st.querySelector('h2');
  if(h && render.moved){h.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
  render.moved = false;
}

function introView(){
  const c = C(), P = c.pron;
  const top = isClass()
    ? chapterPicker()
    : (state.ch>0 ? `<span class="eyebrow">第${NUM[state.ch]}章・目前友感帳戶 ${state.account}</span>` : '');
  return `
    ${top}
    <div class="meet"><div class="face">${face('calm')}</div>
      <div class="who"><span class="eyebrow">你的同學</span><b>${c.full}</b><span>${c.desc}</span></div></div>
    <h2 tabindex="-1">${c.headline}</h2>
    <p class="lede">${c.lede}</p>
    <ul class="rules">
      <li><span class="chip good">精準命中</span><span>說到${P}真正在意的事，心理能量大幅提升</span></li>
      <li><span class="chip sun">命中表面</span><span>${P}會開心，但還沒有被真正看見</span></li>
      <li><span class="chip mute">無關</span><span>沒有變化</span></li>
      <li><span class="chip bad">踩雷</span><span>讓${P}受傷。但你還有一次修補的機會</span></li>
    </ul>
    ${isClass()
      ? `<div class="clue"><span class="t">課堂模式</span>這一章不能使用放大鏡。仔細看觀察線索，想想${c.name}在意什麼。${P}的特質會在結局由老師揭曉。</div>`
      : `<div class="clue"><span class="t">放大鏡</span>這一章可以用 2 次，看見${c.name}沒說出口的特質。不用放大鏡就說中${P}在意的事，能量加成 1.5 倍。</div>`}
    ${modePicker()}
    <div class="row"><button class="btn" id="start">開始第${NUM[state.ch]}章</button></div>`;
}

function chapterPicker(){
  return `<section class="chapters" aria-label="選擇章節"><h3>選擇章節</h3>
    <div class="chap-list">${SETS.class.map((c,i)=>`
      <button class="chap-card ${i===state.ch?'on':''}" data-ch="${i}" aria-pressed="${i===state.ch}">
        <span class="face">${face('calm',c.id)}</span>
        <span><small>第${NUM[i]}章</small><b>${c.name}</b><em>${c.tagline}</em></span>
      </button>`).join('')}</div></section>`;
}

function modePicker(){
  const btn = m => `<button class="mode ${state.mode===m?'on':''}" data-mode="${m}" aria-pressed="${state.mode===m}">
      <b>${MODES[m].name}${m==='class'?LOCK_ICON:''}</b><span>${MODES[m].desc}</span></button>`;
  const pw = state.pwFor ? `
    <form class="pw" id="pwform" novalidate>
      <label for="pw-input">切換到${MODES[state.pwFor].name}，請輸入教師密碼</label>
      <div class="pw-row">
        <input id="pw-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" ${state.pwErr?'aria-invalid="true" aria-describedby="pw-err"':''}>
        <button class="btn" type="submit">確認</button>
        <button class="btn soft" type="button" id="pwcancel">取消</button>
      </div>
      ${state.pwErr?'<span class="pw-err" id="pw-err" role="alert">密碼不正確，請再輸入一次。</span>':''}
    </form>` : '';
  return `<section class="modes-wrap" aria-label="遊戲模式">
    <h3>遊戲模式</h3>
    <div class="modes">${btn('student')}${btn('class')}</div>
    ${pw}
  </section>`;
}

function sceneView(){
  const s = SC()[state.idx];
  const ord = state.order[state.idx];
  return `
    <div class="meet"><div class="face">${face(state.mood)}</div>
      <div class="who"><span class="eyebrow">${s.tag}・共 ${SC().length} 個</span><h2 tabindex="-1">${s.title}</h2></div></div>
    <div class="narr">${s.narr.map(t=>`<p>${t}</p>`).join('')}</div>
    <div class="clue"><span class="t">觀察線索</span>${s.clue}</div>
    ${isClass()?'':traitCard()}
    <div class="choices" role="group" aria-label="選擇你的回應"><span class="q">你會怎麼說？</span>
      ${ord.map((oi,i)=>`<button class="choice" data-opt="${oi}"><span class="k">${'ABCD'[i]}</span><span>${s.options[oi].text}</span></button>`).join('')}
    </div>`;
}

function repairView(){
  const s = SC()[state.idx];
  return `
    <div class="meet"><div class="face">${face(s.repair.mood||'hurt')}</div>
      <div class="who"><span class="eyebrow">${s.tag}・修補回合</span><h2 tabindex="-1">說錯話了，怎麼辦？</h2></div></div>
    <div class="narr"><p>${s.repair.narr}</p></div>
    <div class="clue"><span class="t">修補</span>修補成功可以拿回一部分能量，還會得到一枚修復徽章。修補失敗，損失會加倍。</div>
    <div class="choices" role="group" aria-label="選擇你的修補"><span class="q">你會怎麼說？</span>
      ${s.repair.options.map((o,i)=>`<button class="choice" data-rep="${i}"><span class="k">${'ABC'[i]}</span><span>${o.text}</span></button>`).join('')}
    </div>`;
}

function resultView(){
  const L = state.last, o = L.opt, T = TYPES[o.type];
  const d = L.delta, cls = d>0?'up':d<0?'down':'zero';
  const isHarm = o.type==='harm';
  const last = state.idx===SC().length-1;
  const nextLabel = isHarm ? '試著修補' : (last ? '看看這一章的結果' : '下一個場景');
  const s = SC()[state.idx];
  const rep = state.phase==='repairResult';
  return `
    <div class="meet"><div class="face">${face(state.mood)}</div>
      <div class="who"><span class="eyebrow">${s.tag}${rep?'・修補回合':''}</span><h2 tabindex="-1">${rep?'說錯話了，怎麼辦？':s.title}</h2></div></div>
    <p class="said">你說：<q>${o.text.replace(/^「|」$/g,'')}</q></p>
    <p class="act">${o.act}</p>
    <div class="thought ${d<0?'hurt':''}"><span class="who">${C().name}心裡想</span>${o.thought}</div>
    <div class="verdict">
      <span class="chip ${T.cls}">${T.label}</span>
      <span class="delta ${cls}">${d>0?'+':''}${d} 能量${L.bonus?'<small>沒用放大鏡 ×1.5</small>':''}</span>
      ${L.badge?'<span class="chip sun">獲得修復徽章</span>':''}
    </div>
    ${o.note?`<div class="note"><b>想一想</b>${o.note}</div>`:''}
    <div class="row"><button class="btn ${isHarm?'warn':''}" id="next">${nextLabel}</button></div>`;
}

const tierIdx = () => TIERS.findIndex(t=>state.energy>=t.min);

function endView(){
  const c = C(), ti = tierIdx(), t = TIERS[ti], en = c.endings[ti];
  const lastCh = state.ch===SETS[state.mode].length-1;
  const rev = SC().map((s,si)=>{
    const lg = state.log.find(l=>l.scene===si)||{};
    const items = s.options.map((o,oi)=>revItem(o, lg.choice===oi)).join('');
    const rep = lg.repair!=null ? `<span class="revsub">修補回合</span>${s.repair.options.map((o,ri)=>revItem(o, lg.repair===ri)).join('')}` : '';
    return `<details class="rev"><summary>${s.tag}・${s.title}</summary><div class="revlist">${items}${rep}</div></details>`;
  }).join('');
  let buttons;
  if(isClass()) buttons = `<button class="btn" id="tomenu">回到章節選擇</button>`;
  else if(!lastCh) buttons = `<button class="btn soft" id="replay">重玩這一章</button><button class="btn" id="nextch">繼續第${NUM[state.ch+1]}章：${SETS[state.mode][state.ch+1].name}</button>`;
  else buttons = `<button class="btn soft" id="replay">重玩這一章</button><button class="btn" id="restart">從第一章重新開始</button>`;
  return `
    <div class="meet"><div class="face">${face(moodFromEnergy(state.energy))}</div>
      <div class="who"><span class="eyebrow">第${NUM[state.ch]}章結束${!isClass()&&lastCh?'・全部章節完成':''}</span><h2 tabindex="-1">${en.rel}</h2></div></div>
    <p class="epi">${en.epi}</p>
    <div class="bigrow">
      <div class="big"><span class="lbl">${c.name}最後的能量</span><span class="n">${state.energy}</span></div>
      <div class="big"><span class="lbl">友感帳戶</span><span class="n">${state.accountStart} → ${state.account}</span></div>
      <div class="big"><span class="lbl">本章入帳</span><span class="n" style="color:var(${t.acct>=0?'--good':'--bad'})">${t.acct>0?'+':''}${t.acct}</span></div>
    </div>
    ${state.badge?`<div class="badge"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="var(--sun)"/><circle cx="20" cy="20" r="12.5" fill="none" stroke="var(--sheet)" stroke-width="1.5" stroke-dasharray="2 2.5"/><path d="M13 21 Q17 14 20 19 Q23 14 27 21 Q23 27 20 29 Q17 27 13 21Z" fill="var(--sheet)"/></svg><div><b>修復徽章</b><span>說錯話之後，你好好地修補了。這比永遠不說錯更難。</span></div></div>`:''}
    ${endTrait()}
    <div class="tablebox"><table class="tiers">
      <thead><tr><th>最後能量</th><th>友感帳戶</th><th>之後的關係</th></tr></thead>
      <tbody>${TIERS.map((x,i)=>`<tr class="${i===ti?'on':''}"><td class="num">${x.label}</td><td class="num">${x.acct>0?'+':''}${x.acct}</td><td>${c.endings[i].rel}，下次起始能量 ${x.start}</td></tr>`).join('')}</tbody>
    </table></div>
    <h3>回顧：每一句話，${c.name}心裡怎麼想</h3>
    ${rev}
    <h3>${isClass()?'和同學討論':'想一想'}</h3>
    <ol class="qs">${c.questions.map(q=>`<li>${q}</li>`).join('')}</ol>
    ${isClass()&&c.teacherNote?`<div class="note"><b>給老師</b>${c.teacherNote}</div>`:''}
    <div class="row">${buttons}</div>`;
}

function endTrait(){
  const c = C();
  if(!state.endReveal) return `
    <section class="lens-cta">
      <div><b>${c.name}沒說出口的三件事</b><span>${isClass()?`先讓同學猜一猜，${c.name}是什麼樣的人。`:`你在遊戲中用了 ${state.lensUsed} 次放大鏡。現在，把它全部看清楚。`}</span></div>
      <button class="btn lens-go" id="endlens">${LENS_ICON}特質放大鏡</button>
    </section>`;
  return `
    <section class="lens-full" id="lensfull" tabindex="-1" aria-label="${c.name}的特質">
      <h3>${LENS_ICON}特質放大鏡</h3>
      <p class="lens-hint">先讓同學猜一猜，再點右邊的放大鏡揭曉。</p>
      ${c.traits.map((L,i)=>{
        const open = state.layerShown[i];
        const anim = justOpened===i ? 'revealed' : '';
        return `<div class="lens-layer ${L.cls} ${justOpened==='all'?'enter':''}" style="--i:${i}">
          <span class="tag">${L.tag}</span>
          <div class="body">${open
            ? `<b class="${anim}">${L.b}</b><p class="${anim}">${L.p}</p>`
            : `<span class="ask">${L.ask}</span><span class="blur" aria-hidden="true"><b>${L.b}</b><p>${L.p}</p></span>`}</div>
          ${open?'':`<button class="peek" data-layer="${i}" aria-label="揭曉${L.tag}">${LENS_ICON}</button>`}
        </div>`}).join('')}
    </section>`;
}

function revItem(o, mine){
  const T = TYPES[o.type];
  return `<div class="revitem ${mine?'mine':''}"><div class="top"><span class="chip ${T.cls}">${T.label}・${o.delta>0?'+':''}${o.delta}</span>${mine?'<span class="mine-tag">你的選擇</span>':''}</div>
    <span class="line">${o.text}</span><span class="th">${C().name}心裡想：${o.thought}</span></div>`;
}

function sceneMood(i){return SC()[i].startMood || moodFromEnergy(state.energy)}

function bind(){
  const on = (sel,fn)=>{const b=$(sel);if(b)b.addEventListener('click',fn)};
  const all = (sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.addEventListener('click',()=>fn(b)));
  on('#start',()=>go({phase:'scene',idx:0,mood:sceneMood(0)}));
  on('#lensbtn',()=>{if(state.lensUsed<state.lensMax){state.lensUsed++;render()}});
  all('[data-opt]',b=>choose(+b.dataset.opt));
  all('[data-rep]',b=>chooseRepair(+b.dataset.rep));
  all('[data-ch]',b=>{const i=+b.dataset.ch;if(i!==state.ch){state=fresh(state.mode,i);render()}});
  on('#next',next);
  on('#nextch',()=>{state=fresh(state.mode,state.ch+1,state.account);go({})});
  on('#replay',()=>{state=fresh(state.mode,state.ch,state.accountStart);go({})});
  on('#restart',()=>{state=fresh(state.mode,0);go({})});
  on('#tomenu',()=>{state=fresh(state.mode,state.ch);go({})});
  all('[data-mode]',b=>{
    const m=b.dataset.mode;
    if(m===state.mode){state.pwFor=null;state.pwErr=false;render();return}
    state.pwFor=m;state.pwErr=false;render();
    const i=$('#pw-input');if(i)i.focus();
  });
  on('#pwcancel',()=>{state.pwFor=null;state.pwErr=false;render()});
  const pf=$('#pwform');
  if(pf) pf.addEventListener('submit',e=>{
    e.preventDefault();
    if(hash($('#pw-input').value.trim())===TEACHER_HASH){
      const m=state.pwFor;saveMode(m);state=fresh(m);render();
    }else{
      state.pwErr=true;render();const i=$('#pw-input');if(i)i.focus();
    }
  });
  on('#endlens',()=>{state.endReveal=true;justOpened='all';render();justOpened=null;const f=$('#lensfull');if(f)f.focus({preventScroll:true})});
  all('[data-layer]',b=>{
    const i=+b.dataset.layer;
    state.layerShown[i]=true;justOpened=i;render();justOpened=null;
    const f=$('#lensfull');if(f)f.focus({preventScroll:true});
  });
}

function go(patch){Object.assign(state,patch);render.moved=true;render()}

function choose(oi){
  const o = SC()[state.idx].options[oi];
  let d = o.delta, bonus=false;
  if(o.type==='hit' && !isClass() && state.lensUsed===0){d=Math.round(d*1.5);bonus=true}
  state.energy = clamp(state.energy+d);
  state.log.push({scene:state.idx,choice:oi});
  state.last = {opt:o,delta:d,bonus};
  state.mood = o.mood || (o.type==='hit'?'shy':o.type==='harm'?'hurt':moodFromEnergy(state.energy));
  go({phase:'result'});
}

function chooseRepair(ri){
  const o = SC()[state.idx].repair.options[ri];
  state.energy = clamp(state.energy+o.delta);
  state.log.find(l=>l.scene===state.idx).repair = ri;
  const badge = o.type==='repair';
  if(badge) state.badge = true;
  state.last = {opt:o,delta:o.delta,badge};
  state.mood = o.mood || (badge?'calm':o.type==='explain'?'hurt':moodFromEnergy(state.energy));
  go({phase:'repairResult'});
}

function next(){
  if(state.phase==='result' && state.last.opt.type==='harm'){go({phase:'repair'});return}
  if(state.idx<SC().length-1){go({phase:'scene',idx:state.idx+1,mood:sceneMood(state.idx+1)});return}
  state.account += TIERS[tierIdx()].acct;
  go({phase:'end'});
}

function start(data){
  state = fresh();
  if(data && data.state && data.state.phase) state = Object.assign(fresh(), data.state);
  render();
}
try{window.claude?.hot?.snapshot?.(()=>({state}))}catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
